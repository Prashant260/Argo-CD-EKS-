name: CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true

      - name: Run tests
        run: |
          pytest -q || true

      - name: Static analysis (placeholder)
        run: echo "Run SAST tools here"

      - name: Dependency scan (placeholder)
        run: echo "Run SCA tools here (Trivy/Snyk)"

      - name: Login to ECR
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws --version
          REGISTRY=${{ secrets.ECR_REPOSITORY%/* }}
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $REGISTRY

      - name: Build and push image
        id: build-image
        env:
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          IMAGE_TAG=$(date +%Y%m%d%H%M%S)
          FULL_IMAGE="$ECR_REPOSITORY:$IMAGE_TAG"
          docker build -t "$FULL_IMAGE" .
          docker push "$FULL_IMAGE"
          echo "image=$FULL_IMAGE" >> $GITHUB_OUTPUT

      - name: Update GitOps repo
        env:
          GITOPS_REPO: ${{ secrets.GITOPS_REPO }}
          GITOPS_REPO_TOKEN: ${{ secrets.GITOPS_REPO_TOKEN }}
        run: |
          IMAGE=${{ steps.build-image.outputs.image }}
          echo "Updating GitOps repo with image $IMAGE"
          bash scripts/update-gitops.sh "$IMAGE"
