name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: alffino-main-deployment
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials for Terraform
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Validate Terraform
        run: |
          terraform -chdir=terraform fmt -check
          terraform -chdir=terraform init -input=false
          terraform -chdir=terraform validate

      - name: Plan Terraform
        run: terraform -chdir=terraform plan -input=false -no-color

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency and IaC scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          skip-dirs: .git,.venv,.pytest_cache,.cache,terraform/.terraform
          trivyignores: .trivyignore
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true

  apply-infrastructure:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Apply infrastructure
        run: |
          terraform -chdir=terraform init -input=false
          terraform -chdir=terraform apply -input=false -auto-approve

      - name: Configure kubectl
        run: aws eks update-kubeconfig --region ap-southeast-2 --name argocd-eks

      - name: Register Argo CD application
        env:
          GITOPS_REPO: ${{ secrets.GITOPS_REPO }}
        run: |
          if [ -z "${GITOPS_REPO}" ]; then
            echo "ERROR: Repository secret GITOPS_REPO is not set."
            echo "Set GITOPS_REPO to the git URL of your GitOps repo, e.g. https://github.com/yourorg/your-gitops-repo.git"
            exit 1
          fi

          sed "s|REPLACE_WITH_GITOPS_REPO|${GITOPS_REPO}|" argocd/app.yaml > /tmp/argocd-app.yaml
          echo "--- /tmp/argocd-app.yaml ---"
          sed -n '1,160p' /tmp/argocd-app.yaml
          kubectl apply -f /tmp/argocd-app.yaml

  build-and-scan-image:
    needs: apply-infrastructure
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build-image
        env:
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          FULL_IMAGE="$ECR_REPOSITORY:$IMAGE_TAG"
          docker build -t "$FULL_IMAGE" .
          docker push "$FULL_IMAGE"
          echo "image=$FULL_IMAGE" >> $GITHUB_OUTPUT

      - name: Scan container image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.build-image.outputs.image }}
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true

  promote-and-verify:
    needs: build-and-scan-image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Validate promotion configuration
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          GITOPS_REPO: ${{ secrets.GITOPS_REPO }}
          GITOPS_REPO_TOKEN: ${{ secrets.GITOPS_REPO_TOKEN }}
        run: |
          missing=()
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY ECR_REPOSITORY GITOPS_REPO GITOPS_REPO_TOKEN; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'ERROR: missing required GitHub secret(s): %s\n' "${missing[*]}"
            exit 1
          fi

          if [[ "$GITOPS_REPO" =~ ^github\.com/ ]]; then
            echo "ERROR: GITOPS_REPO must include https://, for example https://github.com/OWNER/REPO.git"
            exit 1
          fi

          if [[ "$GITOPS_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "GITOPS_REPO owner/repository format is valid."
          elif [[ "$GITOPS_REPO" =~ ^https://github\.com/[^/]+/[^/]+/?$ ]]; then
            echo "GITOPS_REPO format is valid; .git will be added by the promotion script."
          elif [[ "$GITOPS_REPO" =~ ^https://github\.com/[^/]+/[^/]+\.git$ ]]; then
            echo "GITOPS_REPO format is valid."
          else
            echo "ERROR: GITOPS_REPO must be a GitHub URL or owner/repository path."
            exit 1
          fi

      - name: Promote image through GitOps
        env:
          GITOPS_REPO: ${{ secrets.GITOPS_REPO }}
          GITOPS_REPO_TOKEN: ${{ secrets.GITOPS_REPO_TOKEN }}
        run: |
          bash scripts/update-gitops.sh "${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}"

      - name: Configure kubectl
        run: aws eks update-kubeconfig --region ap-southeast-2 --name argocd-eks

      - name: Verify application rollout
        run: kubectl rollout status deployment/alffino-python-hello -n alffino --timeout=10m
