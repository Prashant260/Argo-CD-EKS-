apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: magnit-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: REPLACE_WITH_GITOPS_REPO
    targetRevision: HEAD
    path: path/to/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
